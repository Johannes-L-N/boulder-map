function gradeBand(g) {
  if (!g) return null;
  if (g === 'P') return 'unknown';
  if (/^[34]\+?$/.test(g)) return 'b1';
  if (/^5\+?$/.test(g)) return 'b2';
  if (/^6[AB]\+?$/.test(g)) return 'b3';
  if (/^6C\+?$/.test(g) || /^7A\+?$/.test(g)) return 'b4';
  return 'b5';
}
const bandOrder = ['b1', 'b2', 'b3', 'b4', 'b5', 'unknown'];
const colors = {
  b1:      '#2ecc71',
  b2:      '#3498db',
  b3:      '#f39c12',
  b4:      '#e74c3c',
  b5:      '#8e44ad',
  unknown: '#95a5a6'
};
const bandLabel = {
  b1: '3 to 4+',
  b2: '5 to 5+',
  b3: '6A to 6B+',
  b4: '6C to 7A+',
  b5: '7B and up',
  unknown: 'Unknown'
};
const auxCats = [
  {
    key: 't', titleHtml: 'T&oslash;rke',
    opts: [['quick','Rask'],['normal','Normal'],['slow','Sen t&oslash;rk'],['unknown','Ukjent']]
  },
  {
    key: 'd', titleHtml: 'Utsatt',
    opts: [['low','Lav'],['medium','Middels'],['high','Farlig'],['severe','Alvorlig fare'],['unknown','Ukjent']]
  },
  {
    key: 's', titleHtml: 'Bratthet',
    opts: [['slab','Sva'],['vertical','Vertikal'],['overhang','Overhengende'],['unknown','Ukjent']]
  }
];

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

const markerLayer = L.layerGroup().addTo(map);
const markers = [];
const counts = { b1:0, b2:0, b3:0, b4:0, b5:0, unknown:0 };
const auxCounts = { t:{}, d:{}, s:{} };
for (const b of BOULDERS) {
  const bands = new Set();
  const b1 = gradeBand(b.g1);
  if (b1) bands.add(b1);
  const b2 = b.g2 ? gradeBand(b.g2) : null;
  if (b2) bands.add(b2);
  if (bands.size === 0) bands.add('unknown');
  for (const x of bands) counts[x]++;
  for (const cat of ['t','d','s']) {
    const v = b[cat] || 'unknown';
    auxCounts[cat][v] = (auxCounts[cat][v] || 0) + 1;
  }
  const colorBand = b1 || (b2 || 'unknown');
  const m = L.circleMarker([b.lat, b.lng], {
    radius: 5,
    color: colors[colorBand],
    fillColor: colors[colorBand],
    fillOpacity: 0.85,
    weight: 1
  });
  const popup =
    '<b>' + escapeHtml(b.n) + '</b><br>' +
    (b.g1 ? 'Grade1: ' + escapeHtml(b.g1) + '<br>' : '') +
    (b.g2 ? 'Grade2: ' + escapeHtml(b.g2) + '<br>' : '') +
    (b.c ? 'Crag: ' + escapeHtml(b.c) + '<br>' : '') +
    (b.fa ? 'FA: ' + escapeHtml(b.fa) + '<br>' : '') +
    '<a href="' + b.u + '" target="_blank" rel="noopener">Open in gryttr</a>';
  m.bindPopup(popup);
  m._bands = bands;
  m._name = b.n.toLowerCase();
  m._b = b;
  markers.push(m);
  markerLayer.addLayer(m);
}

const sel = {
  band: { b1:true, b2:true, b3:true, b4:true, b5:true, unknown:true },
  t: new Set(),
  d: new Set(),
  s: new Set()
};
for (const cat of auxCats) for (const [slug] of cat.opts) sel[cat.key].add(slug);
let searchTerm = '';

function passesAux(val, set) {
  return set.has(val || 'unknown');
}

function markerVisible(m) {
  const b = m._b;
  let anyBand = false;
  for (const k of m._bands) { if (sel.band[k]) { anyBand = true; break; } }
  if (!anyBand) return false;
  if (!passesAux(b.t, sel.t)) return false;
  if (!passesAux(b.d, sel.d)) return false;
  if (!passesAux(b.s, sel.s)) return false;
  if (searchTerm && m._name.indexOf(searchTerm) === -1) return false;
  return true;
}

function refresh() {
  for (const m of markers) {
    if (m._path) m._path.style.display = markerVisible(m) ? '' : 'none';
  }
}

const filterIconSvg = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>';

const ctrl = L.control({ position: 'topright' });
ctrl.onAdd = () => {
  const d = L.DomUtil.create('div', 'panel');
  let bodyHtml =
    '<input type="search" id="q" placeholder="S&oslash;k navn...">' +
    '<div id="results" class="results" style="display:none"></div>' +
    '<h4>Grad</h4>' +
    bandOrder.map(k =>
      '<label><input type="checkbox" data-band="' + k + '" checked> ' +
      '<span class="swatch" style="background:' + colors[k] + '"></span>' +
      bandLabel[k] + ' <span class="count">(' + counts[k] + ')</span></label>'
    ).join('');
  for (const cat of auxCats) {
    const visible = cat.opts.filter(([slug]) => (auxCounts[cat.key][slug] || 0) > 0);
    if (visible.length === 0) continue;
    bodyHtml += '<h4>' + cat.titleHtml + '</h4>';
    for (const [slug, label] of visible) {
      const n = auxCounts[cat.key][slug];
      bodyHtml += '<label><input type="checkbox" data-aux="' + cat.key +
              '" data-slug="' + slug + '" checked> ' + label +
              ' <span class="count">(' + n + ')</span></label>';
    }
  }
  bodyHtml += '<div class="total">Total: ' + BOULDERS.length + ' boulders</div>';
  d.innerHTML =
    '<div class="panel-header">' +
      '<button class="panel-toggle" type="button" title="Toggle filters" aria-label="Toggle filters" aria-expanded="true">' + closeIconSvg + '</button>' +
    '</div>' +
    '<div class="panel-body">' + bodyHtml + '</div>';
  L.DomEvent.disableClickPropagation(d);
  L.DomEvent.disableScrollPropagation(d);
  return d;
};
ctrl.addTo(map);

const panelEl = document.querySelector('.panel');
const toggleBtn = panelEl.querySelector('.panel-toggle');
toggleBtn.addEventListener('click', () => {
  const collapsed = panelEl.classList.toggle('collapsed');
  toggleBtn.innerHTML = collapsed ? filterIconSvg : closeIconSvg;
  toggleBtn.setAttribute('aria-expanded', String(!collapsed));
});

const MAX_RESULTS = 50;
const resultsDiv = document.getElementById('results');

function renderResults() {
  if (!searchTerm) {
    resultsDiv.style.display = 'none';
    resultsDiv.innerHTML = '';
    return;
  }
  resultsDiv.style.display = 'block';
  const matchIdx = [];
  for (let i = 0; i < markers.length; i++) {
    if (!markerVisible(markers[i])) continue;
    matchIdx.push(i);
    if (matchIdx.length > MAX_RESULTS) break;
  }
  if (matchIdx.length === 0) {
    resultsDiv.innerHTML = '<div class="empty">No matches</div>';
    return;
  }
  const shown = matchIdx.slice(0, MAX_RESULTS);
  let html = '';
  for (const i of shown) {
    const b = markers[i]._b;
    const gradeText = (b.g1 || '?') + (b.g2 ? ' / ' + b.g2 : '');
    html += '<div class="item" data-idx="' + i + '">' +
            '<span>' + escapeHtml(b.n) + '</span>' +
            '<span class="grade-tag">' + escapeHtml(gradeText) + '</span></div>';
  }
  if (matchIdx.length > MAX_RESULTS) {
    html += '<div class="more">Showing first ' + MAX_RESULTS + ' &mdash; refine to see more</div>';
  }
  resultsDiv.innerHTML = html;
}

resultsDiv.addEventListener('click', (ev) => {
  const item = ev.target.closest('.item');
  if (!item) return;
  const idx = parseInt(item.dataset.idx, 10);
  if (isNaN(idx)) return;
  const m = markers[idx];
  map.setView(m.getLatLng(), Math.max(map.getZoom(), 17));
  m.openPopup();
  q.blur();
});

document.querySelectorAll('[data-band]').forEach(cb => {
  cb.addEventListener('change', () => {
    sel.band[cb.dataset.band] = cb.checked;
    refresh();
    renderResults();
  });
});

document.querySelectorAll('[data-aux]').forEach(cb => {
  cb.addEventListener('change', () => {
    const cat = cb.dataset.aux;
    const slug = cb.dataset.slug;
    if (cb.checked) sel[cat].add(slug); else sel[cat].delete(slug);
    refresh();
    renderResults();
  });
});

const q = document.getElementById('q');
let searchTimer = null;
q.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    searchTerm = q.value.toLowerCase().trim();
    refresh();
    renderResults();
  }, 120);
});

function showToast(msg, ms) {
  let el = document.getElementById('toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast';
    document.body.appendChild(el);
    el.addEventListener('click', () => el.classList.remove('show'));
  }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._timer);
  if (ms !== 0) {
    el._timer = setTimeout(() => el.classList.remove('show'), ms || 4000);
  }
}

function geoErrorMessage(e) {
  if (e.code === 1) return 'Location access denied. Enable it in your browser/OS settings.';
  if (e.code === 2) return 'Location unavailable (no GPS signal?)';
  if (e.code === 3) return 'Location request timed out';
  return e.message || 'Could not get your location';
}

let userMarker = null;
let userAccuracy = null;
let watching = false;
let locateBtn = null;
let pendingCenter = false;
let lastError = null;
map.on('locationfound', (e) => {
  lastError = null;
  if (userMarker) {
    userMarker.setLatLng(e.latlng);
    userAccuracy.setLatLng(e.latlng).setRadius(e.accuracy);
  } else {
    userAccuracy = L.circle(e.latlng, {
      radius: e.accuracy, color: '#2196F3', fillColor: '#2196F3',
      fillOpacity: 0.15, weight: 1, interactive: false
    }).addTo(map);
    userMarker = L.circleMarker(e.latlng, {
      radius: 7, color: '#fff', fillColor: '#2196F3',
      fillOpacity: 1, weight: 2, interactive: false
    }).addTo(map);
  }
  if (pendingCenter) {
    map.setView(e.latlng, Math.max(map.getZoom(), 16));
    pendingCenter = false;
  }
  if (locateBtn) locateBtn.classList.add('active');
});
map.on('locationerror', (e) => {
  console.warn('Geolocation error:', e.code, e.message);
  lastError = { code: e.code, message: e.message };
  if (locateBtn) locateBtn.classList.remove('active');
  showToast(geoErrorMessage(e), 0);
});

function locateMe() {
  if (!('geolocation' in navigator)) {
    showToast('Geolocation not supported by this browser', 0);
    return;
  }
  if (lastError) {
    showToast(geoErrorMessage(lastError), 0);
    map.locate({ enableHighAccuracy: true, timeout: 15000 });
    return;
  }
  if (!watching) {
    watching = true;
    map.locate({ watch: true, enableHighAccuracy: true, timeout: 15000 });
    showToast('Locating...', 2500);
    return;
  }
  if (userMarker) {
    map.setView(userMarker.getLatLng(), Math.max(map.getZoom(), 16));
    showToast('Centered on your location', 1500);
  } else {
    pendingCenter = true;
    showToast('Locating...', 2500);
  }
}

const locateCtrl = L.control({ position: 'bottomright' });
locateCtrl.onAdd = () => {
  const c = L.DomUtil.create('div', 'leaflet-bar locate-control');
  c.innerHTML = '<button type="button" title="Show my location" aria-label="Show my location">' +
    '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
    '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3" fill="currentColor"/>' +
    '<line x1="12" y1="1" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="23"/>' +
    '<line x1="1" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="23" y2="12"/>' +
    '</svg></button>';
  locateBtn = c.querySelector('button');
  L.DomEvent.disableClickPropagation(c);
  L.DomEvent.disableScrollPropagation(c);
  L.DomEvent.on(locateBtn, 'click', (ev) => {
    L.DomEvent.preventDefault(ev);
    L.DomEvent.stopPropagation(ev);
    locateMe();
  });
  return c;
};
locateCtrl.addTo(map);
</script>
</body>
